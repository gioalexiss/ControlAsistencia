# Configuraci�n de correo - SendGrid API HTTP
# Usa la API HTTP de SendGrid (NO SMTP) para evitar bloqueos en PaaS
# Funciona en Render, Railway y todos los servicios PaaS
# Configurar estas variables de entorno:
#   SENDGRID_API_KEY - Tu API Key de SendGrid (SG.xxx...)
#   SENDGRID_FROM_EMAIL - El correo verificado en SendGrid
#   SENDGRID_FROM_NAME - Nombre del remitente (opcional)
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME:Sistema Control de Asistencia}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML