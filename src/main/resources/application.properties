spring.application.name=controlAsistencia
server.port=${PORT:8085}
spring.datasource.url=jdbc:mysql://mysql-32a884e7-practi.l.aivencloud.com:20421/defaultdb?useSSL=true
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Puerto - Normalmente trabaja en el 8080 - Servidor WEB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Configuraci�n de correo - SendGrid SMTP
# SendGrid funciona en Render, Railway y otros PaaS sin problemas
# Configurar estas variables de entorno:
#   SENDGRID_API_KEY - Tu API Key de SendGrid (SG.xxx...)
#   MAIL_FROM - El correo verificado en SendGrid (ej: tu_correo@gmail.com)
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.protocol=smtp
spring.mail.test-connection=false
spring.mail.default-encoding=UTF-8
# Correo remitente (debe estar verificado en SendGrid)
spring.mail.from=${MAIL_FROM}
# Logging
logging.level.org.springframework.mail=INFO
logging.level.com.sun.mail=INFO
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML